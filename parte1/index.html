<!doctype html>
<html lang="pt-br">
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CineTrack</title>
    </head>
    <body>
        <header>
            <h1>CineTrack</h1>
            <input type="search" placeholder="Buscar filme">
            <button>+ Adicionar</button>
        </header>
        <nav aria-label="Filtros de status">
            <button class="ativo">Todos</button>
            <button>Assistido</button>
            <button>Assistindo</button>
            <button>Quero assistir</button>
        </nav>
        <main>
            <section id="lista" aria-live="polite">
                <article class="card">
                    <img src="https://www.themoviedb.org/t/p/w200/6ricSDD83BClJsFdGB6x7cM0MFQ.jpg" alt="">
                    <div class="card-info">
                        <h2 class="titulo">Interestelar</h2>
                        <div class="card-inner">
                            <div>
                                <span class="ano">2014</span>
                                &bull;
                                <span class="genero">Ficção científica</span>
                            </div>
                            <p class="nota">Nota: &starf; &starf; &starf; &starf; &star;</p>
                            <span class="status">assistido</span>
                        </div>
                        <div class="card-actions">
                            <button>Editar</button>
                            <button>Remover</button>
                        </div>
                    </div>
                </article>
                <article class="card">
                    <img src="https://www.themoviedb.org/t/p/w200/1HdMUghqlgOIvbsU9ZtO40IPRzl.jpg" alt="">
                    <div class="card-info">
                        <h2 class="titulo">Harry Potter e o Prisioneiro de Azkaban</h2>
                        <div class="card-inner">
                            <div>
                                <span class="ano">2004</span>
                                &bull;
                                <span class="genero">Fantasia</span>
                            </div>
                            <p class="nota">Nota: &starf; &starf; &starf; &starf; &star;</p>
                            <span class="status">assistido</span>
                        </div>
                        <div class="card-actions">
                            <button>Editar</button>
                            <button>Remover</button>
                        </div>
                    </div>
                </article>
            </section>
        </main>
        <footer>
            <small>CineTrack - UEM</small>
        </footer>

        <div id="modal">
            <div class="modal-content">
                <h1>Adicionar filme</h1>
                <form action="" method="post" id="form-filme">
                    <p>
                        <label for="input-titulo">Título</label><br>
                        <input required type="text" id="input-titulo">
                    </p>
                    <p>
                        <label for="input-ano">Ano</label><br>
                        <input required type="number" id="input-ano" max="2030" min="1888">
                    </p>
                    <p>
                        <label for="input-genero">Gênero</label><br>
                        <input required type="text" id="input-genero">
                    </p>
                    <p>
                        <label for="input-poster">Poster</label><br>
                        <input type="url" id="input-poster">
                    </p>
                    <p>
                        <label for="select-status">Status</label><br>
                        <select required id="select-status">
                            <option value="assistido">Assistido</option>
                            <option value="assistindo">Assistindo</option>
                            <option value="quero-assistir">Quero assistir</option>
                        </select>
                    </p>
                    <p>
                        <label for="input-nota">Nota (1 a 5)</label><br>
                        <input type="number" id="input-nota" min="1" max="5">
                    </p>
                    <p>
                        <label for="textarea-comentario">Comentário</label><br>
                        <textarea id="textarea-comentario"></textarea>
                    </p>
                    <p>
                        <button type="button">Cancelar</button>
                        <button type="submit">Salvar</button>
                    </p>
                </form>
            </div>
        </div>
    </body>
</html>
